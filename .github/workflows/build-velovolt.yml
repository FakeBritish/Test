name: Build VeloVolt APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "velovolt-build/**"
      - ".github/workflows/build-velovolt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Reassemble VeloVolt source archive
        shell: bash
        run: |
          cat velovolt-build/parts/part*.b64 | base64 --decode > VeloVolt_source.zip
          unzip -q VeloVolt_source.zip
          test -f VeloVolt/settings.gradle.kts
          sed -i 's/compileSdk = 37/compileSdk = 36/' VeloVolt/app/build.gradle.kts
          sed -i 's/compose-bom:2026.09.00/compose-bom:2025.08.00/' VeloVolt/app/build.gradle.kts
          sed -i 's/core-ktx:1.17.0/core-ktx:1.16.0/' VeloVolt/app/build.gradle.kts
          sed -i 's/activity-compose:1.13.0/activity-compose:1.10.1/' VeloVolt/app/build.gradle.kts
          sed -i 's/lifecycle-runtime-ktx:2.11.0/lifecycle-runtime-ktx:2.9.2/' VeloVolt/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p = Path("VeloVolt/app/src/main/java/com/glc/velovolt/ui/Screens.kt")
          s = p.read_text()
          s = s.replace('Tab(section==i,{section=i},{Text(t)})', 'Tab(selected=section==i,onClick={section=i},text={Text(t)})')
          s = s.replace('Icons.Default.OfflineMap', 'Icons.Default.Map')
          p.write_text(s)
          root = Path("VeloVolt/app/src/main/java")
          for k in root.rglob("*.kt"):
              t = k.read_text()
              t = t.replace('fun setTab(t:MainTab)', 'fun switchTab(t:MainTab)')
              t = t.replace('.setTab(', '.switchTab(')
              t = t.replace('::setTab', '::switchTab')
              k.write_text(t)
          PY
          grep -n "compileSdk" VeloVolt/app/build.gradle.kts
          grep -n "ScrollableTabRow" VeloVolt/app/src/main/java/com/glc/velovolt/ui/Screens.kt
          echo "Source archive reconstructed and CI fixes applied."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        working-directory: VeloVolt
        shell: bash
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -f VeloVolt/app/build/outputs/apk/debug/app-debug.apk
          cp VeloVolt/app/build/outputs/apk/debug/app-debug.apk VeloVolt-debug.apk
          ls -lh VeloVolt-debug.apk

      - name: Upload VeloVolt APK
        uses: actions/upload-artifact@v4
        with:
          name: VeloVolt-debug-apk
          path: VeloVolt-debug.apk
          if-no-files-found: error
          retention-days: 7

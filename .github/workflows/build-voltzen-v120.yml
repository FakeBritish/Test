name: VoltZen 1.2.0 - Android APK
on:
  workflow_dispatch:
  push:
    branches: [voltzen-v120-reference-ui]
    paths:
      - 'voltzen/source-v120.tar.gz'
      - '.github/workflows/build-voltzen-v120.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK API 35
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unpack exact source and static tests
        run: |
          mkdir -p generated
          tar -xzf voltzen/source-v120.tar.gz -C generated
          python3 generated/QA_PROYECTO.py
          grep -q "versionName '1.2.0'" generated/app/build.gradle
          grep -q 'metricGridRow' generated/app/src/main/java/com/glc/voltzen/MainActivity.java
      - name: Build APK
        run: gradle --no-daemon --stacktrace -p generated :app:assembleDebug
      - name: Copy APK and validate package
        run: |
          test -s generated/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p voltzen/APK
          cp generated/app/build/outputs/apk/debug/app-debug.apk voltzen/APK/VoltZen-v1.2.0-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging voltzen/APK/VoltZen-v1.2.0-debug.apk | grep "package: name='com.glc.voltzen.debug'"
          sha256sum voltzen/APK/VoltZen-v1.2.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VoltZen-1.2.0-APK
          path: voltzen/APK/VoltZen-v1.2.0-debug.apk
          if-no-files-found: error
      - name: Store APK on this isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add voltzen/APK/VoltZen-v1.2.0-debug.apk
          git commit -m 'Publish compiled VoltZen 1.2.0 APK [skip ci]'
          git push origin HEAD:voltzen-v120-reference-ui

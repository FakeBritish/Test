name: VoltZen 1.1.0 - APK Horizontal y Focus
on:
  workflow_dispatch:
  push:
    branches:
      - voltzen-v110-landscape-focus
    paths:
      - voltzen/source-v110.tar.gz
      - .github/workflows/build-voltzen-v110.yml
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android API 35 desde el SDK preinstalado
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extraer proyecto VoltZen 1.1.0
        run: |
          mkdir -p generated
          tar -xzf voltzen/source-v110.tar.gz -C generated
          python3 generated/QA_PROYECTO.py
          grep -q "versionName '1.1.0'" generated/app/build.gradle
          grep -q 'setFocus' generated/app/src/main/java/com/glc/voltzen/MainActivity.java
          grep -q 'SCREEN_ORIENTATION_LANDSCAPE' generated/app/src/main/java/com/glc/voltzen/MainActivity.java
      - name: Compilar APK
        run: gradle --no-daemon --stacktrace -p generated :app:assembleDebug
      - name: Verificar APK
        run: |
          mkdir -p voltzen/APK
          test -s generated/app/build/outputs/apk/debug/app-debug.apk
          cp generated/app/build/outputs/apk/debug/app-debug.apk voltzen/APK/VoltZen-v1.1.0-debug.apk
          sha256sum voltzen/APK/VoltZen-v1.1.0-debug.apk
      - name: Artefacto para instalar
        uses: actions/upload-artifact@v4
        with:
          name: VoltZen-v1.1.0-APK
          path: voltzen/APK/VoltZen-v1.1.0-debug.apk
          if-no-files-found: error
      - name: Guardar APK en rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voltzen/APK/VoltZen-v1.1.0-debug.apk
          git commit -m "Add VoltZen 1.1.0 compiled APK [skip ci]"
          git push origin HEAD:voltzen-v110-landscape-focus

name: Publish RideZen Litterbox Link

on:
  push:
    branches:
      - ridezen-delivery-launcherhome2

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled bundle
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://tempfile.org/AUnmWNdrRzn/download" \
            -o RideZen-LAUNCHERHOME2-CI.zip
          ls -lh RideZen-LAUNCHERHOME2-CI.zip

      - name: Upload bundle to Litterbox
        shell: bash
        run: |
          set -e
          URL="$(curl --fail --show-error --silent \
            -F "reqtype=fileupload" \
            -F "time=1h" \
            -F "fileToUpload=@RideZen-LAUNCHERHOME2-CI.zip" \
            "https://litterbox.catbox.moe/resources/internals/api.php")"
          echo "LITTERBOX_URL=$URL"

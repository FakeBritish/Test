name: Publish RideZen Artifact

on:
  push:
    branches:
      - ridezen-delivery-launcherhome2

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled bundle
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://tempfile.org/AUnmWNdrRzn/download" \
            -o RideZen-LAUNCHERHOME2-CI.zip
          ls -lh RideZen-LAUNCHERHOME2-CI.zip

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: RideZen-LAUNCHERHOME2-CI
          path: RideZen-LAUNCHERHOME2-CI.zip
          if-no-files-found: error
          retention-days: 1

name: Publish RideZen Beacon Chunks

on:
  push:
    branches:
      - ridezen-delivery-launcherhome2

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled bundle
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://tempfile.org/AUnmWNdrRzn/download" \
            -o RideZen-LAUNCHERHOME2-CI.zip
          base64 -w 0 RideZen-LAUNCHERHOME2-CI.zip > bundle.b64
          split -b 4M -d -a 2 --additional-suffix=.txt bundle.b64 ridezen_chunk_
          ls -lh ridezen_chunk_*.txt

      - name: Upload text chunks to Beacon
        shell: bash
        run: |
          set -e
          i=0
          for f in ridezen_chunk_*.txt; do
            RESPONSE="$(curl --fail --show-error --silent \
              "https://beacon.host/v1/publish" \
              -F "file=@$f")"
            echo "BEACON_CHUNK_$i=$RESPONSE"
            i=$((i+1))
          done
          echo "BEACON_CHUNK_COUNT=$i"

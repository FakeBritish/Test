name: Publish RideZen Beacon Text Bundle

on:
  push:
    branches:
      - ridezen-delivery-launcherhome2

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled bundle
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://tempfile.org/AUnmWNdrRzn/download" \
            -o RideZen-LAUNCHERHOME2-CI.zip
          ls -lh RideZen-LAUNCHERHOME2-CI.zip

      - name: Encode as text
        run: |
          base64 -w 0 RideZen-LAUNCHERHOME2-CI.zip > RideZen-LAUNCHERHOME2-CI.zip.b64.txt
          ls -lh RideZen-LAUNCHERHOME2-CI.zip.b64.txt

      - name: Upload text bundle to Beacon
        shell: bash
        run: |
          set -e
          RESPONSE="$(curl --fail --show-error --silent \
            "https://beacon.host/v1/publish" \
            -F "file=@RideZen-LAUNCHERHOME2-CI.zip.b64.txt")"
          echo "BEACON_RESPONSE=$RESPONSE"

name: Build LocalBeat 3.20.9 APK

on:
  push:
    branches:
      - localbeat-3209-apk-build
    paths:
      - "localbeat-3209-build/**"
      - ".github/workflows/build-localbeat-3209.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Reassemble LocalBeat source
        shell: bash
        run: |
          set -euo pipefail
          cat localbeat-3209-build/parts/part*.b64 | tr -d '\r\n' | base64 --decode > localbeat-3209-payload.tar.xz
          echo "4115d0600c8227bd26b6760677a944e08a52675a55936a54ebbf2bc796c012bf  localbeat-3209-payload.tar.xz" | sha256sum -c -
          tar -xJf localbeat-3209-payload.tar.xz
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f overlay/localbeat_spotify.py
          grep -q 'versionName = "3.20.9"' android/app/build.gradle.kts
          grep -q 'versionCode = 2103246' android/app/build.gradle.kts

      - name: Prepare yt-dlp and LocalBeat Spotify extractor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/ytdlp/src/main/vendor-python
          mkdir -p android/ytdlp/src/main/vendor-python
          python3 -m pip install --disable-pip-version-check --no-deps --target android/ytdlp/src/main/vendor-python "yt-dlp==2026.8.19" "certifi==2026.7.22"
          cp overlay/localbeat_spotify.py android/ytdlp/src/main/vendor-python/yt_dlp/extractor/localbeat_spotify.py
          INIT="android/ytdlp/src/main/vendor-python/yt_dlp/extractor/__init__.py"
          printf '%s\n' \
            '' \
            '# LocalBeat custom Spotify extractor. Appended by CI.' \
            '_localbeat_original_gen_extractor_classes = gen_extractor_classes' \
            '' \
            'def _localbeat_spotify_ie():' \
            '    from .localbeat_spotify import SpotifyLocalBeatIE' \
            '    return SpotifyLocalBeatIE' \
            '' \
            'def gen_extractor_classes():' \
            '    classes = list(_localbeat_original_gen_extractor_classes())' \
            '    spotify = _localbeat_spotify_ie()' \
            '    return [spotify, *[klass for klass in classes if klass is not spotify]]' >> "$INIT"
          python3 -m py_compile android/ytdlp/src/main/vendor-python/yt_dlp/extractor/localbeat_spotify.py
          python3 -m py_compile "$INIT"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build LocalBeat debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and name APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="LocalBeat-3.20.9-INSTALLABLE.apk"
          test -f "$SRC"
          cp "$SRC" "$OUT"
          unzip -t "$OUT" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT" | head -n 5
          sha256sum "$OUT" | tee LocalBeat-3.20.9-INSTALLABLE.apk.sha256
          ls -lh "$OUT"

      - name: Upload LocalBeat APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalBeat-3.20.9-INSTALLABLE
          path: |
            LocalBeat-3.20.9-INSTALLABLE.apk
            LocalBeat-3.20.9-INSTALLABLE.apk.sha256
          if-no-files-found: error
          retention-days: 7
